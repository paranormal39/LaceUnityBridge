<!DOCTYPE html>
<html>
<head>
    <title>Midnight Wallet Detection Test</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background: #1a1a2e; color: #eee; }
        .status { padding: 15px; margin: 10px 0; border-radius: 8px; }
        .found { background: #2d5a27; }
        .not-found { background: #5a2727; }
        .info { background: #27415a; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; margin: 5px; }
        pre { background: #0d0d1a; padding: 15px; border-radius: 8px; overflow-x: auto; }
        h1 { color: #7b68ee; }
    </style>
</head>
<body>
    <h1>Midnight Wallet Detection Test</h1>
    <p>This page tests if Lace Midnight Preview is injecting the wallet connector.</p>
    
    <div id="status" class="status info">Checking...</div>
    
    <h3>Actions</h3>
    <button onclick="checkWallet()">Check Wallet Now</button>
    <button onclick="checkDelayed()">Check After 3s Delay</button>
    <button onclick="tryConnect()">Try Connect</button>
    <button onclick="debugMidnightConnection()" style="background:#7b68ee;color:#fff;">Debug Midnight Connection</button>
    
    <h3>Console Output</h3>
    <pre id="log"></pre>

    <script>
        function log(msg) {
            console.log(msg);
            document.getElementById('log').textContent += msg + '\n';
        }

        function setStatus(msg, found) {
            var el = document.getElementById('status');
            el.textContent = msg;
            el.className = 'status ' + (found ? 'found' : 'not-found');
        }

        function checkWallet() {
            log('\n=== Checking wallet ===');
            log('Time: ' + new Date().toISOString());

            // ---- Explicit DApp connector path checks ----
            log('\n--- Explicit connector path checks ---');
            var explicitPaths = [
                { path: 'window.midnight',            get: function() { return window.midnight; } },
                { path: 'window.midnight.mnLace',     get: function() { return window.midnight && window.midnight.mnLace; } },
                { path: 'window.midnight.lace',       get: function() { return window.midnight && window.midnight.lace; } },
                { path: 'window.midnight.Lace',       get: function() { return window.midnight && window.midnight.Lace; } },
                { path: 'window.midnight.midnight',   get: function() { return window.midnight && window.midnight.midnight; } },
                { path: 'window.midnight.MnLace',     get: function() { return window.midnight && window.midnight.MnLace; } },
                { path: 'window.midnight.mn_lace',    get: function() { return window.midnight && window.midnight.mn_lace; } },
                { path: 'window.cardano',             get: function() { return window.cardano; } },
                { path: 'window.cardano.lace',        get: function() { return window.cardano && window.cardano.lace; } },
                { path: 'window.cardano.midnight',    get: function() { return window.cardano && window.cardano.midnight; } },
                { path: 'window.cardano.mnLace',      get: function() { return window.cardano && window.cardano.mnLace; } },
                { path: 'window.cardano.nami',        get: function() { return window.cardano && window.cardano.nami; } },
                { path: 'window.lace',                get: function() { return window.lace; } },
                { path: 'window.mnLace',              get: function() { return window.mnLace; } }
            ];

            var foundConnector = null;
            for (var p = 0; p < explicitPaths.length; p++) {
                var entry = explicitPaths[p];
                try {
                    var obj = entry.get();
                    if (obj) {
                        var t = typeof obj;
                        var info = entry.path + ' = EXISTS (' + t + ')';
                        if (t === 'object') {
                            var objKeys = Object.keys(obj);
                            info += ' keys=[' + objKeys.join(', ') + ']';
                            if (typeof obj.enable === 'function') { info += ' [HAS enable() - DAPP CONNECTOR]'; foundConnector = entry.path; }
                            if (typeof obj.isEnabled === 'function') info += ' [HAS isEnabled()]';
                            if (obj.name) info += ' name=' + obj.name;
                            if (obj.apiVersion) info += ' apiVersion=' + obj.apiVersion;
                        } else if (t === 'function') {
                            info += ' [is a function]';
                        }
                        log('CHECK: ' + info);
                    } else {
                        log('CHECK: ' + entry.path + ' = NOT PRESENT');
                    }
                } catch (err) {
                    log('CHECK: ' + entry.path + ' = ERROR: ' + err.message);
                }
            }

            // ---- Deep enumerate window.midnight ----
            log('\n--- Deep enumerate window.midnight ---');
            if (window.midnight) {
                log('window.midnight EXISTS, typeof: ' + typeof window.midnight);
                var keys = Object.keys(window.midnight);
                log('  keys: ' + keys.join(', '));
                try {
                    var allProps = Object.getOwnPropertyNames(window.midnight);
                    if (allProps.length !== keys.length) log('  getOwnPropertyNames: ' + allProps.join(', '));
                } catch(e) {}

                keys.forEach(function(key) {
                    var val = window.midnight[key];
                    if (val && typeof val === 'object') {
                        var subKeys = Object.keys(val);
                        log('  .' + key + ' = [object] keys=[' + subKeys.join(', ') + ']');
                        if (typeof val.enable === 'function') log('    ^ HAS enable() - wallet connector!');
                        if (typeof val.isEnabled === 'function') log('    ^ HAS isEnabled()');
                        if (val.name) log('    ^ name: ' + val.name);
                        if (val.apiVersion) log('    ^ apiVersion: ' + val.apiVersion);
                        // One more level deep
                        subKeys.forEach(function(sk) {
                            var sv = val[sk];
                            if (sv && typeof sv === 'object') {
                                log('    .' + key + '.' + sk + ' = [object] keys=[' + Object.keys(sv).join(', ') + ']');
                                if (typeof sv.enable === 'function') log('      ^ HAS enable() - NESTED connector!');
                            }
                        });
                    } else if (typeof val === 'function') {
                        log('  .' + key + ' = [function]');
                    } else {
                        log('  .' + key + ' = ' + val);
                    }
                });
            } else {
                log('window.midnight is NOT present');
            }

            // ---- Deep enumerate window.cardano ----
            log('\n--- Deep enumerate window.cardano ---');
            if (window.cardano) {
                var cardanoKeys = Object.keys(window.cardano);
                log('window.cardano EXISTS, keys: ' + cardanoKeys.join(', '));
                cardanoKeys.forEach(function(key) {
                    var val = window.cardano[key];
                    if (val && typeof val === 'object') {
                        log('  .' + key + ' = [object] keys=[' + Object.keys(val).join(', ') + ']');
                        if (typeof val.enable === 'function') log('    ^ HAS enable() - wallet connector!');
                        if (typeof val.isEnabled === 'function') log('    ^ HAS isEnabled()');
                        if (val.name) log('    ^ name: ' + val.name);
                        if (val.apiVersion) log('    ^ apiVersion: ' + val.apiVersion);
                    } else if (typeof val === 'function') {
                        log('  .' + key + ' = [function]');
                    }
                });
            } else {
                log('window.cardano is NOT present');
            }

            // ---- Other globals ----
            log('\n--- Other global checks ---');
            if (window.lace) log('window.lace EXISTS, keys: ' + Object.keys(window.lace).join(', '));
            else log('window.lace: NOT present');
            if (window.mnLace) log('window.mnLace EXISTS, keys: ' + Object.keys(window.mnLace).join(', '));
            else log('window.mnLace: NOT present');

            // ---- Summary ----
            if (foundConnector) {
                setStatus('FOUND connector at: ' + foundConnector, true);
            } else if (!window.midnight && !window.cardano) {
                setStatus('NOT FOUND: Neither window.midnight nor window.cardano exist', false);
                log('\n*** WALLET NOT DETECTED ***');
                log('Possible causes:');
                log('1. Lace Midnight Preview extension not installed');
                log('2. Extension not enabled for this site');
                log('3. Page loaded before extension injected (try refresh)');
                log('4. Running on file:// URL (must use http:// or https://)');
            } else {
                setStatus('Objects exist but no enable() connector found', false);
            }
        }

        function checkDelayed() {
            log('\nWaiting 3 seconds...');
            setStatus('Waiting 3 seconds...', false);
            setTimeout(function() {
                log('Delayed check starting...');
                checkWallet();
            }, 3000);
        }

        async function tryConnect() {
            log('\n=== Attempting connection ===');
            
            var connector = null;
            var path = '';
            
            // Find connector
            if (window.midnight) {
                if (typeof window.midnight.enable === 'function') {
                    connector = window.midnight;
                    path = 'window.midnight';
                } else {
                    var keys = Object.keys(window.midnight);
                    for (var i = 0; i < keys.length; i++) {
                        var key = keys[i];
                        if (window.midnight[key] && typeof window.midnight[key].enable === 'function') {
                            connector = window.midnight[key];
                            path = 'window.midnight.' + key;
                            break;
                        }
                    }
                }
            }
            
            if (!connector && window.cardano) {
                if (window.cardano.midnight && typeof window.cardano.midnight.enable === 'function') {
                    connector = window.cardano.midnight;
                    path = 'window.cardano.midnight';
                } else if (window.cardano.lace && typeof window.cardano.lace.enable === 'function') {
                    connector = window.cardano.lace;
                    path = 'window.cardano.lace';
                }
            }
            
            if (!connector) {
                log('ERROR: No connector found');
                setStatus('Cannot connect - no wallet found', false);
                return;
            }
            
            log('Using connector at: ' + path);
            
            try {
                log('Calling enable()...');
                var api = await connector.enable();
                log('enable() returned: ' + (api ? 'API object' : 'null'));
                
                if (api) {
                    log('API keys: ' + Object.keys(api).join(', '));
                    
                    if (typeof api.state === 'function') {
                        log('Calling api.state()...');
                        var state = await api.state();
                        log('state() returned: ' + JSON.stringify(state, null, 2));
                        
                        if (state && state.address) {
                            setStatus('CONNECTED! Address: ' + state.address.substring(0, 20) + '...', true);
                        }
                    }
                }
            } catch (err) {
                log('ERROR: ' + err.message);
                setStatus('Connection error: ' + err.message, false);
            }
        }

        async function debugMidnightConnection() {
            document.getElementById('log').textContent = '';
            log('============================================');
            log('=== MIDNIGHT CONNECTION DEBUG ===');
            log('Time: ' + new Date().toISOString());
            log('URL: ' + window.location.href);
            log('Protocol: ' + window.location.protocol);
            log('============================================');

            // Step 1: Check window.midnight
            log('\n[STEP 1] Checking window.midnight...');
            if (!window.midnight) {
                log('❌ window.midnight does NOT exist');
                log('   Possible causes:');
                log('   1. Lace Midnight Preview extension not installed');
                log('   2. Extension disabled or not enabled for this site');
                log('   3. Page loaded before extension injected (try waiting/refreshing)');
                log('   4. Running on file:// URL (must use http:// or https://)');
                log('   5. Extension only injects on specific origins');
                if (window.location.protocol === 'file:') {
                    log('   ⚠️  You ARE on file:// - extensions cannot inject here!');
                }
                if (window.MidnightSDK) {
                    log('   ℹ️  window.MidnightSDK bundle IS loaded');
                    log('   ℹ️  Bundle connectorAvailable: ' + window.MidnightSDK.isConnectorAvailable());
                }
                setStatus('window.midnight not found', false);
                log('=== END (no window.midnight) ===');
                return;
            }

            log('✅ window.midnight EXISTS, typeof: ' + typeof window.midnight);

            // Step 2: Enumerate keys
            log('\n[STEP 2] Enumerating window.midnight keys...');
            var keys = [];
            try {
                keys = Object.keys(window.midnight);
                log('   Object.keys: ' + JSON.stringify(keys));
            } catch (e) {
                log('   ❌ Object.keys failed: ' + e.message);
            }
            try {
                var allProps = Object.getOwnPropertyNames(window.midnight);
                if (allProps.length !== keys.length) {
                    log('   getOwnPropertyNames: ' + JSON.stringify(allProps));
                    log('   ⚠️  Non-enumerable properties detected!');
                }
            } catch (e) {}

            if (typeof window.midnight.enable === 'function') {
                log('   ⚡ window.midnight itself has enable() - it IS a connector!');
            }

            // Step 3: Find connectors
            log('\n[STEP 3] Scanning for connectors (objects with enable())...');
            var connectors = [];

            if (typeof window.midnight.enable === 'function') {
                connectors.push({ path: 'window.midnight', obj: window.midnight });
            }

            for (var i = 0; i < keys.length; i++) {
                var key = keys[i];
                try {
                    var val = window.midnight[key];
                    var vtype = typeof val;
                    if (val && vtype === 'object') {
                        var subKeys = Object.keys(val);
                        log('   .' + key + ' = [object] keys=[' + subKeys.join(', ') + ']');
                        if (typeof val.enable === 'function') {
                            log('     ⚡ HAS enable() - THIS IS A CONNECTOR');
                            connectors.push({ path: 'window.midnight.' + key, obj: val });
                        }
                        if (typeof val.isEnabled === 'function') log('     ✓ has isEnabled()');
                        if (typeof val.serviceUriConfig === 'function') log('     ✓ has serviceUriConfig()');
                        if (val.name) log('     name: ' + val.name);
                        if (val.apiVersion) log('     apiVersion: ' + val.apiVersion);

                        for (var si = 0; si < subKeys.length; si++) {
                            try {
                                var subVal = val[subKeys[si]];
                                if (subVal && typeof subVal === 'object' && typeof subVal.enable === 'function') {
                                    log('     .' + key + '.' + subKeys[si] + ' ⚡ NESTED CONNECTOR');
                                    connectors.push({ path: 'window.midnight.' + key + '.' + subKeys[si], obj: subVal });
                                }
                            } catch (e) {}
                        }
                    } else if (vtype === 'function') {
                        log('   .' + key + ' = [function]');
                    } else {
                        log('   .' + key + ' = ' + String(val) + ' (' + vtype + ')');
                    }
                } catch (e) {
                    log('   .' + key + ' = ERROR: ' + e.message);
                }
            }

            if (connectors.length === 0) {
                log('   ❌ NO connectors found (no objects with enable())');
                log('   Extension may still be initializing - try again in a few seconds.');
                setStatus('window.midnight exists but no connector found', false);
                log('=== END (no connectors) ===');
                return;
            }

            log('   Found ' + connectors.length + ' connector(s):');
            for (var c = 0; c < connectors.length; c++) {
                log('     [' + c + '] ' + connectors[c].path);
            }

            // Step 4: Inspect primary connector
            var primary = connectors[0];
            log('\n[STEP 4] Inspecting primary connector: ' + primary.path);
            var conn = primary.obj;

            var methods = ['enable', 'isEnabled', 'state', 'serviceUriConfig', 'balanceAndProveTransaction', 'submitTransaction', 'name', 'apiVersion', 'icon'];
            for (var m = 0; m < methods.length; m++) {
                var mname = methods[m];
                try {
                    var mval = conn[mname];
                    if (typeof mval === 'function') {
                        log('   ✓ ' + mname + '() = [function]');
                    } else if (mval !== undefined) {
                        log('   ✓ ' + mname + ' = ' + String(mval));
                    } else {
                        log('   ✗ ' + mname + ' = undefined');
                    }
                } catch (e) {
                    log('   ✗ ' + mname + ' = ERROR: ' + e.message);
                }
            }

            // Step 5: Try isEnabled()
            log('\n[STEP 5] Calling isEnabled() on ' + primary.path + '...');
            try {
                if (typeof conn.isEnabled === 'function') {
                    var enabled = await conn.isEnabled();
                    log('   isEnabled() returned: ' + enabled);
                    if (enabled) {
                        log('   ✅ Already authorized for this site!');
                    } else {
                        log('   ℹ️  Not yet authorized - enable() will prompt user');
                    }
                } else {
                    log('   ⚠️  No isEnabled() method');
                }
            } catch (e) {
                log('   ❌ isEnabled() error: ' + e.message);
            }

            // Step 6: Try enable()
            log('\n[STEP 6] Calling enable() on ' + primary.path + '...');
            log('   (This may trigger a wallet popup for user approval)');
            var api = null;
            try {
                api = await conn.enable();
                if (!api) {
                    log('   ❌ enable() returned null/undefined');
                    setStatus('enable() returned null', false);
                    log('=== END (enable failed) ===');
                    return;
                }
                log('   ✅ enable() succeeded!');
                log('   API typeof: ' + typeof api);
                var apiKeys = Object.keys(api);
                log('   API keys: ' + JSON.stringify(apiKeys));
            } catch (err) {
                var errMsg = err.message || String(err);
                log('   ❌ enable() error: ' + errMsg);
                if (errMsg.toLowerCase().match(/reject|decline|deny|cancel/)) {
                    log('   → User REJECTED the connection');
                }
                setStatus('enable() failed: ' + errMsg, false);
                log('=== END (enable error) ===');
                return;
            }

            // Step 7: Inspect API
            log('\n[STEP 7] Inspecting returned API object...');
            var apiMethods = ['state', 'balanceAndProveTransaction', 'submitTransaction', 'serviceUriConfig',
                              'getUsedAddresses', 'getChangeAddress', 'getBalance', 'getUtxos', 'signTx', 'submitTx', 'signData', 'getNetworkId'];
            for (var am = 0; am < apiMethods.length; am++) {
                try {
                    if (typeof api[apiMethods[am]] === 'function') {
                        log('   ✓ api.' + apiMethods[am] + '()');
                    }
                } catch (e) {}
            }

            var isMidnightAPI = typeof api.state === 'function';
            var isCardanoAPI = typeof api.getUsedAddresses === 'function';
            log('   Is Midnight API (has state()): ' + isMidnightAPI);
            log('   Is Cardano CIP-30 API (has getUsedAddresses()): ' + isCardanoAPI);

            // Step 8: Try state()
            if (isMidnightAPI) {
                log('\n[STEP 8] Calling api.state() (Midnight API)...');
                try {
                    var walletState = await api.state();
                    log('   ✅ state() returned!');
                    if (walletState) {
                        var stateKeys = Object.keys(walletState);
                        log('   keys: ' + JSON.stringify(stateKeys));
                        for (var sk = 0; sk < stateKeys.length; sk++) {
                            var skey = stateKeys[sk];
                            var sval = walletState[skey];
                            var stype = typeof sval;
                            if (stype === 'object' && sval !== null) {
                                log('   .' + skey + ' = [object] keys=[' + Object.keys(sval).join(', ') + ']');
                            } else if (stype === 'string' && sval.length > 80) {
                                log('   .' + skey + ' = "' + sval.substring(0, 40) + '...' + sval.substring(sval.length - 20) + '" (len=' + sval.length + ')');
                            } else {
                                log('   .' + skey + ' = ' + String(sval) + ' (' + stype + ')');
                            }
                        }
                        if (walletState.address) log('   📍 ADDRESS: ' + walletState.address);
                        if (walletState.coinPublicKey) log('   🔑 COIN PUBLIC KEY: ' + walletState.coinPublicKey);
                        if (walletState.encryptionPublicKey) log('   🔐 ENCRYPTION PUBLIC KEY: ' + walletState.encryptionPublicKey);
                    } else {
                        log('   ⚠️  state() returned null');
                    }
                } catch (stateErr) {
                    log('   ❌ state() error: ' + (stateErr.message || stateErr));
                }
            }

            // Step 9: Try serviceUriConfig()
            log('\n[STEP 9] Checking serviceUriConfig()...');
            var svcSource = null;
            if (typeof conn.serviceUriConfig === 'function') {
                svcSource = conn;
                log('   Using connector.serviceUriConfig()');
            } else if (typeof api.serviceUriConfig === 'function') {
                svcSource = api;
                log('   Using api.serviceUriConfig()');
            }

            if (svcSource) {
                try {
                    var svcConfig = await svcSource.serviceUriConfig();
                    log('   ✅ serviceUriConfig() returned!');
                    if (svcConfig) {
                        var cfgKeys = Object.keys(svcConfig);
                        log('   keys: ' + JSON.stringify(cfgKeys));
                        for (var ck = 0; ck < cfgKeys.length; ck++) {
                            log('   .' + cfgKeys[ck] + ' = ' + String(svcConfig[cfgKeys[ck]]));
                        }
                        if (svcConfig.indexerUri) log('   🌐 INDEXER: ' + svcConfig.indexerUri);
                        if (svcConfig.indexerWsUri) log('   🌐 INDEXER WS: ' + svcConfig.indexerWsUri);
                        if (svcConfig.proverServerUri) log('   🌐 PROVER: ' + svcConfig.proverServerUri);
                        if (svcConfig.nodeUri) log('   🌐 NODE: ' + svcConfig.nodeUri);
                    } else {
                        log('   ⚠️  serviceUriConfig() returned null');
                    }
                } catch (svcErr) {
                    log('   ❌ serviceUriConfig() error: ' + (svcErr.message || svcErr));
                }
            } else {
                log('   ⚠️  No serviceUriConfig() on connector or API');
            }

            // Step 10: Summary
            log('\n============================================');
            log('=== SUMMARY ===');
            log('   Connector: ' + primary.path);
            log('   API type: ' + (isMidnightAPI ? 'MIDNIGHT' : isCardanoAPI ? 'CARDANO CIP-30' : 'UNKNOWN'));
            log('   enable(): ✅ SUCCESS');
            if (isMidnightAPI) {
                log('   state(): available');
                log('   → Ready for Midnight transactions');
                setStatus('CONNECTED via Midnight API at ' + primary.path, true);
            } else if (isCardanoAPI) {
                log('   → This connector exposes Cardano CIP-30, not Midnight API');
                setStatus('Connected but got Cardano CIP-30 API (not Midnight)', false);
            } else {
                setStatus('Connected but API type unknown', false);
            }
            log('============================================');
            log('=== END DEBUG ===');
        }

        // Initial check on page load
        window.addEventListener('load', function() {
            log('Page loaded at: ' + new Date().toISOString());
            log('URL: ' + window.location.href);
            log('Protocol: ' + window.location.protocol);
            checkWallet();
        });

        // Also check after a short delay (extensions may inject late)
        setTimeout(function() {
            log('\n--- Auto-check after 1.5s ---');
            checkWallet();
        }, 1500);
    </script>
</body>
</html>
